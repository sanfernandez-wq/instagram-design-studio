<style>
  .mvn-page{background:var(--bg);color:var(--text)}
  /* Top bar */
  .mvn-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(20px,5vw,74px);background:color-mix(in oklab,var(--bg) 86%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .mvn-bar .logo-svg{height:24px;width:auto;color:var(--text)}
  .mvn-back{display:inline-flex;align-items:center;gap:9px;font-family:'Hanken Grotesk',sans-serif;
    font-size:13px;letter-spacing:.04em;color:var(--text);text-decoration:none;font-weight:400}
  .mvn-back .arr{transition:transform .3s var(--ease)}
  .mvn-back:hover .arr{transform:translateX(-4px)}
  /* Project intro */
  .mvn-intro{max-width:1000px;margin:0 auto;padding:clamp(48px,8vw,96px) clamp(20px,5vw,74px) clamp(32px,5vw,56px);text-align:center}
  .mvn-eyebrow{display:block;font-family:'Hanken Grotesk',sans-serif;font-size:12px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .mvn-title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;line-height:1.04;
    font-size:clamp(2.6rem,7vw,5rem);margin:0}
  .mvn-title em{font-style:italic;color:var(--accent)}
  .mvn-meta{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:center;margin-top:30px;
    font-family:'Hanken Grotesk',sans-serif;font-size:13px;letter-spacing:.04em;color:var(--muted)}
  .mvn-meta span{position:relative}
  /* Sábana — full-bleed stacked images, no frames, no gaps */
  .mvn-sabana{display:block;width:100%}
  .mvn-sabana img{display:block;width:100%;height:auto;margin:0;border:0}
  /* Footer */
  .mvn-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;
    padding:clamp(44px,6vw,80px) clamp(20px,5vw,74px);border-top:1px solid var(--line)}
  .mvn-foot .fl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;
    font-size:clamp(1.5rem,3.5vw,2.3rem);color:var(--text)}
  .mvn-foot .fr{display:inline-flex;align-items:center;gap:10px;font-family:'Hanken Grotesk',sans-serif;
    font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);text-decoration:none;font-weight:500}
  .mvn-foot .fr .arr{transition:transform .3s var(--ease)}
  .mvn-foot .fr:hover .arr{transform:translateX(5px)}
</style>
</head>
