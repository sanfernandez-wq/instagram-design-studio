<style>

  .mvn-meta{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:center;margin-top:30px;
    font-family:'Hanken Grotesk',sans-serif;font-size:13px;letter-spacing:.04em;color:var(--muted)}
  .mvn-meta span{position:relative}
  /* Sábana — full-bleed stacked images, no frames, no gaps */
  .mvn-sabana{display:block;width:100%}
  .mvn-sabana img{display:block;width:100%;height:auto;margin:0;border:0}
  /* Footer */
  .mvn-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;
